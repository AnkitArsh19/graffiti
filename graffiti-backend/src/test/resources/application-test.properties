spring.application.name=graffiti-backend-test

# Exclude OAuth2 Client Auto Configuration during test profile
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# H2 Database Test Configuration
spring.datasource.url=jdbc:h2:mem:graffitidb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# App Properties
app.jwt.secret=graffiti_super_secret_jwt_key_that_is_at_least_256_bits_long_for_security_1907
app.jwt.expiration-ms=86400000

app.compaction.op-threshold=50
app.compaction.redis-lock-ttl-ms=30000

# Synchronous op persistence for test assertions
app.ops.buffer.enabled=false
