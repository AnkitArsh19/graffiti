<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
    <rect width="100%" height="100%" fill="#ffffff" />
    <text x="30" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Figure 11: Canvas Rendering Scalability & Frame Budget Utilization</text>
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Target Frame Budget: 16.67 ms (60 FPS) | Viewport-Culled Rough.js Pipeline</text>

    <!-- 60 FPS Limit Line -->
    <line x1="80" y1="90" x2="560" y2="90" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="560" y="85" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="end">60 FPS Budget Limit (16.67 ms)</text>

    <!-- Axes -->
    <line x1="80" y1="210" x2="560" y2="210" stroke="#cbd5e1" />
    <line x1="80" y1="90" x2="80" y2="210" stroke="#cbd5e1" />

    <!-- Y labels -->
    <text x="70" y="213" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">0 ms</text>
