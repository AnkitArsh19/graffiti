    <!-- 5,000 -->
    <rect x="405" y="195.096" width="45" height="14.904" rx="2" fill="#0d9488" />
    <text x="427" y="228" font-family="Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">5,000</text>
