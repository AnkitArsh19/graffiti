    <text x="70" y="93" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">16.6 ms</text>

    <!-- Bars for densities: 100 (0.39ms), 500 (1.53ms), 1000 (2.15ms), 2500 (1.99ms), 5000 (2.07ms), 10000 (3.16ms) -->
