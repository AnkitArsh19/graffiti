# Example Docker Compose Configuration for Graffiti Infrastructure
# Copy this file or use docker-compose.yml with a .env file containing your credentials.

services:
  postgres:
    image: postgres:latest
    container_name: graffiti-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graffiti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-graffiti}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: graffiti-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_secure_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
