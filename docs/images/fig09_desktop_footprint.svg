<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260">
    <rect width="100%" height="100%" fill="#ffffff" />
    <text x="30" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Figure 9: Process Memory Utilization (Working Set RAM in MB)</text>
    <text x="30" y="50" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Native Desktop Shell (Tauri v2) vs. Web Browser vs. Electron Baseline</text>

    <!-- Background Grid Lines -->
    <line x1="160" y1="70" x2="160" y2="210" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <line x1="260" y1="70" x2="260" y2="210" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <line x1="360" y1="70" x2="360" y2="210" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <line x1="460" y1="70" x2="460" y2="210" stroke="#cbd5e1" stroke-dasharray="3,3" />
    <line x1="560" y1="70" x2="560" y2="210" stroke="#cbd5e1" stroke-dasharray="3,3" />

    <!-- Grid Labels -->
    <text x="160" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">0 MB</text>
    <text x="260" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">100 MB</text>
    <text x="360" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">200 MB</text>
    <text x="460" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">300 MB</text>
    <text x="560" y="228" font-family="Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">400 MB</text>

    <!-- Bar 1: Tauri v2 (42.5 MB) -->
    <text x="150" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="end">Tauri v2 (Graffiti)</text>
    <rect x="160" y="82" width="42.5" height="24" rx="3" fill="#16a34a" />
    <text x="210" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">42.5 MB (-87.7% vs Electron)</text>

    <!-- Bar 2: Chrome Browser (178.4 MB) -->
    <text x="150" y="142" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="end">Google Chrome (Tab)</text>
    <rect x="160" y="126" width="178.4" height="24" rx="3" fill="#2563eb" />
    <text x="345" y="142" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">178.4 MB</text>

    <!-- Bar 3: Electron Baseline (345.0 MB) -->
    <text x="150" y="186" font-family="Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="end">Electron (Baseline)</text>
    <rect x="160" y="170" width="345" height="24" rx="3" fill="#dc2626" opacity="0.85" />
    <text x="512" y="186" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">345.0 MB</text>
  </svg>